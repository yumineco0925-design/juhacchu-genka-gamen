  <text x="34" y="105" class="head">操作</text>
  <text x="616" y="105" text-anchor="middle" class="head">営業</text>
  <text x="709" y="105" text-anchor="middle" class="head">工事担当</text>
  <text x="801" y="105" text-anchor="middle" class="head">購買</text>
  <text x="894" y="105" text-anchor="middle" class="head">経理</text>

  <text x="34" y="133" class="op"><tspan x="34" y="133">工事の登録・基本情報の編集</tspan><tspan x="34" y="149">（施工中以後は工事担当、完工予定日、備考だけ）</tspan></text>
  <text x="616" y="136" class="value yes">○</text><text x="709" y="136" class="value">×</text><text x="801" y="136" class="value">×</text><text x="894" y="136" class="value">×</text>
  <text x="34" y="174" class="op">受注金額の入力（見積中）</text>
  <text x="616" y="169" class="value yes">○</text><text x="709" y="169" class="value">×</text><text x="801" y="169" class="value">×</text><text x="894" y="169" class="value">×</text>
  <text x="34" y="195" class="op"><tspan x="34" y="195">受注金額の変更</tspan><tspan x="34" y="209">（受注後、理由必須）</tspan></text>
  <text x="616" y="198" class="value">×</text><text x="709" y="198" class="value">×</text><text x="801" y="198" class="value">×</text><text x="894" y="198" class="value yes">○</text>
  <text x="34" y="232" class="op">工事を受注に進める</text>
  <text x="616" y="227" class="value yes">○</text><text x="709" y="227" class="value">×</text><text x="801" y="227" class="value">×</text><text x="894" y="227" class="value">×</text>
  <text x="34" y="258" class="op">工事を受注から見積中に戻す</text>
  <text x="616" y="253" class="value yes">○</text><text x="709" y="253" class="value">×</text><text x="801" y="253" class="value">×</text><text x="894" y="253" class="value">×</text>
  <text x="34" y="284" class="op">着工・施主検収の登録</text>
  <text x="616" y="279" class="value">×</text><text x="709" y="279" class="value yes">○</text><text x="801" y="279" class="value">×</text><text x="894" y="279" class="value">×</text>
  <text x="34" y="310" class="op">施主請求・入金の登録</text>
  <text x="616" y="305" class="value">×</text><text x="709" y="305" class="value">×</text><text x="801" y="305" class="value">×</text><text x="894" y="305" class="value yes">○</text>
  <text x="34" y="331" class="op"><tspan x="34" y="331">工事の状態を1つ戻す</tspan><tspan x="34" y="346">（受注から見積中を除く）</tspan></text>
  <text x="616" y="335" class="value">×</text><text x="709" y="335" class="value">×</text><text x="801" y="335" class="value">×</text><text x="894" y="335" class="value yes">○</text>
  <text x="34" y="370" class="op">予算改定の起案</text>
  <text x="616" y="365" class="value">×</text><text x="709" y="365" class="value focus">○</text><text x="801" y="365" class="value">×</text><text x="894" y="365" class="value">×</text>
  <text x="34" y="396" class="op">予算改定の承認</text>
  <text x="616" y="391" class="value focus">○</text><text x="709" y="391" class="value">×</text><text x="801" y="391" class="value">×</text><text x="894" y="391" class="value">×</text>
  <text x="34" y="422" class="op">予算改定の取消（起案のまま）</text>
  <text x="616" y="417" class="value yes">○</text><text x="709" y="417" class="value yes">○</text><text x="801" y="417" class="value">×</text><text x="894" y="417" class="value">×</text>
  <text x="34" y="443" class="op"><tspan x="34" y="443">発注の起票・再提出</tspan><tspan x="34" y="456">（追加発注・減額発注を含む。工事が受注か施工中のとき）</tspan></text>
  <text x="616" y="451" class="value">×</text><text x="709" y="451" class="value focus">○</text><text x="801" y="451" class="value">×</text><text x="894" y="451" class="value">×</text>
  <text x="34" y="490" class="op">発注の承認・修正依頼</text>
  <text x="616" y="485" class="value">×</text><text x="709" y="485" class="value">×</text><text x="801" y="485" class="value focus">○</text><text x="894" y="485" class="value">×</text>
  <text x="34" y="519" class="op">発注の取消</text>
  <text x="616" y="515" class="value">×</text><text x="709" y="515" class="word">起票のままの物</text><text x="801" y="515" class="word">承認済の物</text><text x="894" y="515" class="value">×</text>
  <text x="34" y="550" class="op">未検収残の打切</text>
  <text x="616" y="545" class="value">×</text><text x="709" y="545" class="value">×</text><text x="801" y="545" class="value yes">○</text><text x="894" y="545" class="value">×</text>
  <text x="34" y="576" class="op">発注検収の登録・取消・訂正</text>
  <text x="616" y="571" class="value">×</text><text x="709" y="571" class="value yes">○</text><text x="801" y="571" class="value yes">○</text><text x="894" y="571" class="value">×</text>
  <text x="34" y="597" class="op"><tspan x="34" y="597">請求の受付・確認・差戻し・</tspan><tspan x="34" y="612">再受付・取消</tspan></text>
  <text x="616" y="601" class="value">×</text><text x="709" y="601" class="value">×</text><text x="801" y="601" class="value">×</text><text x="894" y="601" class="value yes">○</text>
  <text x="34" y="636" class="op">労務費の計上</text>
  <text x="616" y="631" class="value">×</text><text x="709" y="631" class="value">×</text><text x="801" y="631" class="value">×</text><text x="894" y="631" class="value yes">○</text>
  <text x="34" y="665" class="op">取引先の登録・編集</text>
  <text x="616" y="661" class="word">施主のみ</text><text x="709" y="661" class="value">×</text><text x="801" y="654" class="word"><tspan x="801" y="654">仕入先・</tspan><tspan x="801" y="670">外注先</tspan></text><text x="894" y="661" class="value">×</text>
  <text x="34" y="696" class="op">月次の締め・解除</text>
  <text x="616" y="691" class="value">×</text><text x="709" y="691" class="value">×</text><text x="801" y="691" class="value">×</text><text x="894" y="691" class="value yes">○</text>

