<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
  <style>
    text { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo"; fill: #222222; }
    .lead { font-size: 13px; fill: #4d4d4d; }
    .head { font-size: 13px; font-weight: 700; }
    .op { font-size: 12px; }
    .value { font-size: 16px; text-anchor: middle; dominant-baseline: middle; fill: #757575; font-weight: 600; }
    .yes { font-size: 14px; fill: #222222; font-weight: 400; }
    .word { font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
    .focus { fill: #1d4478; font-weight: 700; }
    .grid { stroke: #dcdcdc; stroke-width: 1; }
  </style>
  <rect x="0" y="0" width="960" height="720" fill="#ffffff"/>
  <text x="20" y="22" class="lead">起票と承認は別の役割にする。</text>
  <text x="20" y="44" class="lead">発注は工事担当が起票して購買が承認する。</text>
  <text x="20" y="66" class="lead">予算改定は工事担当が起案して営業が承認する。</text>

  <rect x="20" y="84" width="920" height="620" fill="#ffffff" stroke="#dcdcdc"/>
  <rect x="20" y="84" width="920" height="32" fill="#f3f3f3"/>
