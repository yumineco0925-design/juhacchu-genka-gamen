<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <style>
    text { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo"; fill: #222222; }
    .number { font-size: 20px; font-weight: 700; fill: #1d4478; }
    .role { font-size: 13px; font-weight: 700; }
    .heading { font-size: 14px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 700; fill: #4d4d4d; }
    .body { font-size: 12px; fill: #4d4d4d; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1.5; }
    .role-box { fill: #f3f3f3; }
    .edge { stroke: #1d4478; stroke-width: 2; stroke-linecap: round; }
    .switch { font-size: 12px; font-weight: 700; fill: #1d4478; text-anchor: middle; }
  </style>
  <rect x="0" y="0" width="960" height="360" fill="#f3f3f3"/>

  <rect x="98" y="8" width="124" height="32" rx="4" fill="#ffffff" stroke="#a9c0de"/>
  <text x="160" y="29" class="switch">購買に切り替え</text>
  <line x1="160" y1="40" x2="160" y2="58" stroke="#a9c0de" stroke-width="1.5"/>
  <rect x="252" y="8" width="136" height="32" rx="4" fill="#ffffff" stroke="#a9c0de"/>
  <text x="320" y="29" class="switch">工事担当に戻す</text>
  <line x1="320" y1="40" x2="320" y2="58" stroke="#a9c0de" stroke-width="1.5"/>
  <rect x="418" y="8" width="124" height="32" rx="4" fill="#ffffff" stroke="#a9c0de"/>
  <text x="480" y="29" class="switch">経理に切り替え</text>
  <line x1="480" y1="40" x2="480" y2="58" stroke="#a9c0de" stroke-width="1.5"/>

  <line x1="152" y1="205" x2="168" y2="205" class="edge"/><polygon points="168,205 158,200 158,210" fill="#1d4478"/>
  <line x1="312" y1="205" x2="328" y2="205" class="edge"/><polygon points="328,205 318,200 318,210" fill="#1d4478"/>
  <line x1="472" y1="205" x2="488" y2="205" class="edge"/><polygon points="488,205 478,200 478,210" fill="#1d4478"/>
  <line x1="632" y1="205" x2="648" y2="205" class="edge"/><polygon points="648,205 638,200 638,210" fill="#1d4478"/>
  <line x1="792" y1="205" x2="808" y2="205" class="edge"/><polygon points="808,205 798,200 798,210" fill="#1d4478"/>

  <g transform="translate(0 48)">
  <rect x="8" y="10" width="144" height="292" rx="6" class="card"/>
  <rect x="8" y="10" width="144" height="46" rx="6" class="role-box"/>
  <text x="20" y="41" class="number">1</text><text x="48" y="39" class="role">工事担当</text>
  <text x="20" y="82" class="heading"><tspan x="20" y="82">予算超過の発注を</tspan><tspan x="20" y="102">起票</tspan></text>
  <line x1="20" y1="122" x2="140" y2="122" stroke="#dcdcdc"/>
  <text x="20" y="146" class="label">確かめること</text>
  <text x="20" y="172" class="body"><tspan x="20" y="172">理由の欄が出て</tspan><tspan x="20" y="190">必須になる。</tspan><tspan x="20" y="217">承認のボタンが</tspan><tspan x="20" y="235">押せず「承認は</tspan><tspan x="20" y="253">購買のみ」と出る</tspan></text>

  <rect x="168" y="10" width="144" height="292" rx="6" class="card"/>
  <rect x="168" y="10" width="144" height="46" rx="6" class="role-box"/>
  <text x="180" y="41" class="number">2</text><text x="208" y="39" class="role">購買</text>
  <text x="180" y="82" class="heading">発注を承認</text>
  <line x1="180" y1="122" x2="300" y2="122" stroke="#dcdcdc"/>
  <text x="180" y="146" class="label">確かめること</text>
  <text x="180" y="172" class="body"><tspan x="180" y="172">発注日に承認した</tspan><tspan x="180" y="190">日が入り、承認後は</tspan><tspan x="180" y="208">金額を変えられない</tspan></text>

  <rect x="328" y="10" width="144" height="292" rx="6" class="card"/>
  <rect x="328" y="10" width="144" height="46" rx="6" class="role-box"/>
  <text x="340" y="41" class="number">3</text><text x="368" y="39" class="role">工事担当</text>
  <text x="340" y="82" class="heading"><tspan x="340" y="82">出来高として一部を</tspan><tspan x="340" y="102">発注検収</tspan></text>
  <line x1="340" y1="122" x2="460" y2="122" stroke="#dcdcdc"/>
  <text x="340" y="146" class="label">確かめること</text>
  <text x="340" y="172" class="body"><tspan x="340" y="172">未検収残を超える額は</tspan><tspan x="340" y="190">止まる</tspan></text>

  <rect x="488" y="10" width="144" height="292" rx="6" class="card"/>
  <rect x="488" y="10" width="144" height="46" rx="6" class="role-box"/>
  <text x="500" y="41" class="number">4</text><text x="528" y="39" class="role">経理</text>
  <text x="500" y="82" class="heading"><tspan x="500" y="82">請求を受付して</tspan><tspan x="500" y="102">差し戻す</tspan></text>
  <line x1="500" y1="122" x2="620" y2="122" stroke="#dcdcdc"/>
  <text x="500" y="146" class="label">確かめること</text>
  <text x="500" y="172" class="body"><tspan x="500" y="172">判定が「検収額を</tspan><tspan x="500" y="190">超えている」になり、</tspan><tspan x="500" y="208">確認のボタンが</tspan><tspan x="500" y="226">押せない</tspan></text>

  <rect x="648" y="10" width="144" height="292" rx="6" class="card"/>
  <rect x="648" y="10" width="144" height="46" rx="6" class="role-box"/>
  <text x="660" y="41" class="number">5</text><text x="688" y="39" class="role">経理</text>
  <text x="660" y="82" class="heading"><tspan x="660" y="82">修正版を再受付して</tspan><tspan x="660" y="102">確認</tspan></text>
  <line x1="660" y1="122" x2="780" y2="122" stroke="#dcdcdc"/>
  <text x="660" y="146" class="label">確かめること</text>
  <text x="660" y="172" class="body"><tspan x="660" y="172">判定が「確定できる」</tspan><tspan x="660" y="190">になり、計上月を</tspan><tspan x="660" y="208">選んで確認する</tspan></text>

  <rect x="808" y="10" width="144" height="292" rx="6" class="card"/>
  <rect x="808" y="10" width="144" height="46" rx="6" class="role-box"/>
  <text x="820" y="41" class="number">6</text><text x="848" y="39" class="role">経理</text>
  <text x="820" y="82" class="heading">8月を締める</text>
  <line x1="820" y1="122" x2="940" y2="122" stroke="#dcdcdc"/>
  <text x="820" y="146" class="label">確かめること</text>
  <text x="820" y="172" class="body"><tspan x="820" y="172">締めた後は、8月の</tspan><tspan x="820" y="190">日付で発注検収を</tspan><tspan x="820" y="208">登録できず、請求の</tspan><tspan x="820" y="226">計上月に8月を</tspan><tspan x="820" y="244">選べない</tspan></text>
  </g>
</svg>
